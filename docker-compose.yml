services:
  nginx-dev:
    image: nginx:1.27-alpine
    container_name: wordtracker-nginx-dev
    depends_on:
      - app-dev
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/app
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - wordtracker

  app-dev:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: wordtracker-app-dev
    depends_on:
      db:
        condition: service_healthy
      nlp:
        condition: service_started
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: local-dev-secret-change-me
      DATABASE_URL: postgresql://wordtracker:wordtracker@db:5432/wordtracker?serverVersion=17&charset=utf8
      NLP_BASE_URL: http://nlp:8000
      NLP_HEALTH_URL: http://nlp:8000/health
      VOCABULARY_ENRICHMENT_BASE_URL: http://nlp:8000
      VOCABULARY_ENRICHMENT_TIMEOUT: "120"
    volumes:
      - ./app:/var/www/app
      - ./fixtures:/var/www/fixtures:ro
      - app_var_dev:/var/www/app/var
    networks:
      - wordtracker

  nginx-prod:
    image: nginx:1.27-alpine
    container_name: wordtracker-nginx-prod
    depends_on:
      - app-prod
    ports:
      - "8081:80"
    volumes:
      - ./app:/var/www/app
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - wordtracker

  app-prod:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: wordtracker-app-prod
    depends_on:
      db:
        condition: service_healthy
      nlp:
        condition: service_started
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      XDEBUG_MODE: "off"
      APP_SECRET: local-dev-secret-change-me
      DATABASE_URL: postgresql://wordtracker:wordtracker@db:5432/wordtracker?serverVersion=17&charset=utf8
      NLP_BASE_URL: http://nlp:8000
      NLP_HEALTH_URL: http://nlp:8000/health
      VOCABULARY_ENRICHMENT_BASE_URL: http://nlp:8000
      VOCABULARY_ENRICHMENT_TIMEOUT: "120"
    volumes:
      - ./app:/var/www/app
      - ./fixtures:/var/www/fixtures:ro
      - app_var_prod:/var/www/app/var
    networks:
      - wordtracker

  db:
    image: postgres:17-alpine
    container_name: wordtracker-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: wordtracker
      POSTGRES_USER: wordtracker
      POSTGRES_PASSWORD: wordtracker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordtracker -d wordtracker"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - wordtracker

  nlp:
    build:
      context: .
      dockerfile: docker/nlp/Dockerfile
    container_name: wordtracker-nlp
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3}
      OLLAMA_TIMEOUT_SECONDS: "120"
    volumes:
      - ./nlp:/srv/nlp
      - ./fixtures:/srv/fixtures:ro
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - wordtracker

  ollama:
    image: ollama/ollama:latest
    container_name: wordtracker-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    gpus: all
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - wordtracker

networks:
  wordtracker:
    name: wordtracker

volumes:
  db_data:
  app_var_dev:
  app_var_prod:
  ollama_data:
