parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $nlpHealthUrl: '%env(NLP_HEALTH_URL)%'
            string $nlpBaseUrl: '%env(NLP_BASE_URL)%'
            string $vocabularyEnrichmentBaseUrl: '%env(VOCABULARY_ENRICHMENT_BASE_URL)%'
            float $vocabularyEnrichmentTimeout: '%env(float:VOCABULARY_ENRICHMENT_TIMEOUT)%'
            string $fixturesDir: '%kernel.project_dir%/../fixtures'

    App\:
        resource: '../src/'

    App\Nlp\TextAnalyzerInterface:
        alias: App\Nlp\HttpTextAnalyzer

    App\Enrichment\VocabularyEnrichmentProviderInterface:
        alias: App\Enrichment\HttpVocabularyEnrichmentProvider
